[project]
name = "mcp-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    # Model Context Protocol SDK
    "mcp[cli]==1.28.0",
    # HTTP 客户端库，用于 API 调用
    "httpx==0.28.1",
    # 异步库
    "asyncio==4.0.0",
    # OpenAI
    "openai==2.43.0",
    # LangChain MCP 适配器
    "langchain-mcp-adapters==0.3.0",
    "langgraph==1.2.6",
    "langchain-openai==1.3.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.18",
]

[tool.black]
line-length = 100
