[project]
name = "mcp-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    # HTTP 客户端库，用于 API 调用
    "httpx==0.28.1",
    # LangChain MCP 适配器
    "langchain-mcp-adapters==0.3.0",
    "langchain==1.3.10",
    "langchain-openai==1.3.2",
    # Model Context Protocol SDK
    "mcp[cli]==1.28.0",
    # OpenAI
    "openai==2.43.0",
    # Helper library
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.18",
]

[tool.black]
line-length = 100
