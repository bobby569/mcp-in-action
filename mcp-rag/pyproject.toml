[project]
name = "mcp-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch==2.12.1",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
default = false

[tool.uv.workspace]
members = [
    "milvus-mcp-server",
    "milvus-mcp-client",
    "tablestore-mcp-client",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.18",
]

[tool.black]
line-length = 100

[tool.ruff.lint]
ignore = ["F403", "F405", "F811", "F841"]
